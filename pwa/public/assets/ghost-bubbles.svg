<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 168 64">
  <symbol id="bubble-idle" viewBox="0 0 168 64"><rect x="3" y="3" width="160" height="44" rx="16" fill="#f4eee2" stroke="#3a332b" stroke-width="2.2"/><path d="M126 46 L138 60 L142 46 Z" fill="#f4eee2" stroke="#3a332b" stroke-width="2.2" stroke-linejoin="round"/><text x="83" y="24" font-family="Caveat, cursive" font-size="14" fill="#3a332b" text-anchor="middle">散步中 · 有点得意 ~</text><text x="83" y="38" font-family="Caveat, cursive" font-size="11" fill="#7c9473" text-anchor="middle">~ 中午见 ~</text></symbol>
  <symbol id="bubble-letter" viewBox="0 0 168 64"><rect x="3" y="3" width="160" height="44" rx="16" fill="#f4eee2" stroke="#3a332b" stroke-width="2.2"/><path d="M126 46 L138 60 L142 46 Z" fill="#f4eee2" stroke="#3a332b" stroke-width="2.2" stroke-linejoin="round"/><text x="83" y="24" font-family="Caveat, cursive" font-size="14" fill="#3a332b" text-anchor="middle">有一封信哦 — 已放门口</text><text x="83" y="38" font-family="Caveat, cursive" font-size="11" fill="#d97958" text-anchor="middle">~ 别忘了收 ~</text></symbol>
  <symbol id="bubble-happy" viewBox="0 0 168 64"><rect x="3" y="3" width="160" height="44" rx="16" fill="#f4eee2" stroke="#3a332b" stroke-width="2.2"/><path d="M126 46 L138 60 L142 46 Z" fill="#f4eee2" stroke="#3a332b" stroke-width="2.2" stroke-linejoin="round"/><text x="83" y="24" font-family="Caveat, cursive" font-size="14" fill="#3a332b" text-anchor="middle">快下班啦,记得带钥匙</text><text x="83" y="38" font-family="Caveat, cursive" font-size="11" fill="#d97958" text-anchor="middle">~ 窗户也要关 ~</text></symbol>
  <symbol id="bubble-sleepy" viewBox="0 0 168 64"><rect x="3" y="3" width="160" height="44" rx="16" fill="#f4eee2" stroke="#3a332b" stroke-width="2.2"/><path d="M126 46 L138 60 L142 46 Z" fill="#f4eee2" stroke="#3a332b" stroke-width="2.2" stroke-linejoin="round"/><text x="83" y="24" font-family="Caveat, cursive" font-size="14" fill="#3a332b" text-anchor="middle">哈哈太困了…我先睡会儿</text><text x="83" y="38" font-family="Caveat, cursive" font-size="11" fill="#7c9473" text-anchor="middle">~ 之后再叫你 ~</text></symbol>
  <symbol id="bubble-offline" viewBox="0 0 168 64"><rect x="3" y="3" width="160" height="44" rx="16" fill="#f4eee2" stroke="#3a332b" stroke-width="2.2"/><path d="M126 46 L138 60 L142 46 Z" fill="#f4eee2" stroke="#3a332b" stroke-width="2.2" stroke-linejoin="round"/><text x="83" y="24" font-family="Caveat, cursive" font-size="13" fill="#3a332b" text-anchor="middle">正在连接…信号有点飘</text><text x="83" y="38" font-family="Caveat, cursive" font-size="11" fill="#d97958" text-anchor="middle">~ 一会儿回来 ~</text></symbol>
  <symbol id="bubble-peek" viewBox="0 0 168 64"><rect x="3" y="3" width="160" height="44" rx="16" fill="#f4eee2" stroke="#3a332b" stroke-width="2.2"/><path d="M126 46 L138 60 L142 46 Z" fill="#f4eee2" stroke="#3a332b" stroke-width="2.2" stroke-linejoin="round"/><text x="83" y="24" font-family="Caveat, cursive" font-size="14" fill="#3a332b" text-anchor="middle">你在家吗?我从门缝看看</text><text x="83" y="38" font-family="Caveat, cursive" font-size="11" fill="#7c9473" text-anchor="middle">~ 不应我就缩回去 ~</text></symbol>
</svg>
