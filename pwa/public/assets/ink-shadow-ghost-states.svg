<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1320 1030" role="img" aria-labelledby="title desc">
  <title id="title">Ink Shadow Ghost states</title>
  <desc id="desc">A reusable SVG sprite for six states of the Ink Shadow Ghost companion.</desc>

  <style>
    .body { fill: #625f58; stroke: #3a332b; stroke-width: 6; stroke-linecap: round; stroke-linejoin: round; }
    .shade { fill: #4e4a44; }
    .fold { fill: #eee6d7; stroke: #3a332b; stroke-width: 5; stroke-linecap: round; stroke-linejoin: round; }
    .window { fill: #d4a84f; stroke: #3a332b; stroke-width: 5; stroke-linecap: round; stroke-linejoin: round; }
    .window-light { fill: #e8c873; }
    .window-off { fill: #726d64; stroke: #3a332b; stroke-width: 5; stroke-linecap: round; stroke-linejoin: round; }
    .line { fill: none; stroke: #3a332b; stroke-width: 4; stroke-linecap: round; stroke-linejoin: round; }
    .accent { fill: #d97958; stroke: #3a332b; stroke-width: 4; stroke-linejoin: round; }
    .paper { fill: #f4eee2; stroke: #3a332b; stroke-width: 4; stroke-linejoin: round; }
  </style>

  <defs>
    <!-- Shared body geometry: all states inherit this exact silhouette. -->
    <symbol id="ghost-body" viewBox="0 0 420 660">
      <path class="body" d="M92 617
        C110 552 118 487 113 409
        C108 328 101 241 115 171
        C126 116 155 70 203 38
        L246 0 L258 78
        L315 94
        C338 181 336 275 334 361
        C332 452 349 537 384 592
        C359 610 326 617 292 611
        C258 632 225 633 193 614
        C159 628 124 628 92 617 Z"/>
      <path class="shade" opacity=".44" stroke="none" d="M273 83
        C315 160 319 269 318 362
        C317 454 335 536 367 585
        C344 598 317 601 292 595
        C276 600 261 602 245 600
        C264 557 275 498 272 418
        C268 309 254 201 273 83 Z"/>
      <path class="fold" d="M246 0 L258 78 L298 70 Z"/>
      <path class="window" d="M253 178 Q274 156 294 178 L300 241 Q278 254 254 252 Z"/>
      <path class="window-light" d="M259 180 Q274 167 287 181 L291 235 Q276 242 261 241 Z"/>
      <path class="line" d="M274 168 L278 247 M258 213 Q276 209 296 211"/>
    </symbol>

    <symbol id="ghost-body-offline" viewBox="0 0 420 660">
      <path class="body" opacity=".88" d="M92 617
        C110 552 118 487 113 409
        C108 328 101 241 115 171
        C126 116 155 70 203 38
        L246 0 L258 78
        L315 94
        C338 181 336 275 334 361
        C332 452 349 537 384 592
        C359 610 326 617 292 611
        C258 632 225 633 193 614
        C159 628 124 628 92 617 Z"/>
      <path class="shade" opacity=".58" stroke="none" d="M273 83
        C315 160 319 269 318 362
        C317 454 335 536 367 585
        C344 598 317 601 292 595
        C276 600 261 602 245 600
        C264 557 275 498 272 418
        C268 309 254 201 273 83 Z"/>
      <path class="fold" d="M246 0 L258 78 L298 70 Z"/>
      <path class="window-off" d="M253 178 Q274 156 294 178 L300 241 Q278 254 254 252 Z"/>
      <path class="line" opacity=".45" d="M274 168 L278 247 M258 213 Q276 209 296 211"/>
    </symbol>

    <symbol id="face-idle" viewBox="0 0 420 660">
      <g fill="#3a332b">
        <ellipse cx="132" cy="193" rx="4.5" ry="11"/>
        <ellipse cx="169" cy="193" rx="4.5" ry="11"/>
      </g>
    </symbol>

    <symbol id="face-happy" viewBox="0 0 420 660">
      <path class="line" stroke-width="5" d="M125 193 q8 -8 16 0 M162 193 q8 -8 16 0"/>
      <path class="line" stroke-width="3" d="M142 216 q9 7 18 0"/>
    </symbol>

    <symbol id="face-sleepy" viewBox="0 0 420 660">
      <path class="line" stroke-width="5" d="M125 195 q8 7 16 0 M162 195 q8 7 16 0"/>
    </symbol>

    <symbol id="face-offline" viewBox="0 0 420 660">
      <path class="line" stroke-width="5" opacity=".72" d="M125 195 q8 5 16 0 M162 195 q8 5 16 0"/>
      <circle cx="150" cy="220" r="3" fill="#3a332b" opacity=".55"/>
    </symbol>

    <symbol id="envelope" viewBox="0 0 420 660">
      <g transform="translate(35 435) rotate(-6)">
        <rect class="paper" width="116" height="78" rx="5"/>
        <path class="line" d="M3 6 L58 48 L113 6 M4 72 L43 39 M112 72 L73 39"/>
        <circle class="accent" cx="94" cy="13" r="8"/>
      </g>
    </symbol>

    <symbol id="happy-lines" viewBox="0 0 420 660">
      <path class="line" stroke-width="5" d="M71 255 l-20 -13 M76 270 l-25 0 M78 285 l-19 13"/>
      <path class="line" stroke-width="5" d="M350 255 l20 -13 M347 270 l25 0 M345 285 l19 13"/>
    </symbol>

    <symbol id="sleep-marks" viewBox="0 0 420 660">
      <path fill="#d4a84f" stroke="#3a332b" stroke-width="3" d="M303 118
        A20 20 0 1 0 326 148
        A17 17 0 1 1 303 118 Z"/>
      <path class="line" stroke-width="3" d="M340 132 h14 M347 125 v-14"/>
    </symbol>

    <symbol id="offline-signal" viewBox="0 0 420 660">
      <path class="line" opacity=".52" stroke-width="4" d="M314 176 q18 18 0 36 M327 164 q31 31 0 62"/>
      <circle cx="306" cy="223" r="5" fill="#f4eee2" stroke="#3a332b" stroke-width="3"/>
    </symbol>

    <symbol id="ghost-idle" viewBox="0 0 420 660">
      <use href="#ghost-body"/>
      <use href="#face-idle"/>
    </symbol>

    <symbol id="ghost-letter" viewBox="0 0 420 660">
      <use href="#ghost-body"/>
      <use href="#face-idle"/>
      <use href="#envelope"/>
    </symbol>

    <symbol id="ghost-happy" viewBox="0 0 420 660">
      <g transform="translate(0 -9)">
        <use href="#ghost-body"/>
        <use href="#face-happy"/>
      </g>
      <use href="#happy-lines"/>
    </symbol>

    <symbol id="ghost-sleepy" viewBox="0 0 420 660">
      <ellipse cx="222" cy="628" rx="155" ry="13" fill="#756b5c" opacity=".2"/>
      <g transform="translate(18 38) rotate(-6 210 330) scale(1.05 .88)">
        <use href="#ghost-body"/>
        <use href="#face-sleepy"/>
      </g>
      <use href="#sleep-marks"/>
    </symbol>

    <symbol id="ghost-offline" viewBox="0 0 420 660">
      <use href="#ghost-body-offline"/>
      <use href="#face-offline"/>
      <use href="#offline-signal"/>
    </symbol>

    <symbol id="ghost-peek" viewBox="0 0 420 660">
      <!-- Ghost is behind the door; only the right side, one eye, and one hand remain visible. -->
      <g transform="translate(95 18) rotate(2 210 330) scale(.93 .98)">
        <use href="#ghost-body"/>
        <use href="#face-idle"/>
      </g>
      <!-- Door frame behind the door leaf. -->
      <path class="line" stroke-width="8" d="M32 48 V568 M32 48 H267 M32 568 H267"/>
      <!-- Warm ivory door leaf in the foreground. -->
      <path class="paper" stroke-width="6" d="M48 65 L258 76 L258 551 L48 538 Z"/>
      <path class="line" opacity=".28" d="M67 100 L238 109 L238 232 L67 222 Z M67 338 L238 347 L238 515 L67 505 Z"/>
      <path class="line" opacity=".35" d="M48 76 L258 87"/>
      <!-- Door handle and hinge marks make the object read as a door, not a card. -->
      <circle cx="228" cy="286" r="9" fill="#d4a84f" stroke="#3a332b" stroke-width="4"/>
      <circle cx="55" cy="178" r="4" fill="#3a332b" opacity=".55"/>
      <circle cx="55" cy="425" r="4" fill="#3a332b" opacity=".55"/>
      <!-- One hand reaches around the door edge. -->
      <path class="body" stroke-width="5" d="M250 307
        C261 296 271 302 270 311
        C280 307 287 313 283 321
        C291 322 293 330 286 336
        C279 342 265 339 254 333 Z"/>
    </symbol>
  </defs>

  <!-- The root view is a file://-safe inspection sheet. The symbols above remain reusable. -->
  <rect width="1320" height="1030" fill="#ece5d9"/>
  <g fill="#f4eee2" stroke="#d4cabb" stroke-width="2">
    <rect x="30" y="30" width="390" height="650" rx="22"/>
    <rect x="465" y="30" width="390" height="650" rx="22"/>
    <rect x="900" y="30" width="390" height="650" rx="22"/>
    <rect x="30" y="720" width="390" height="280" rx="22"/>
    <rect x="465" y="720" width="390" height="280" rx="22"/>
    <rect x="900" y="720" width="390" height="280" rx="22"/>
  </g>
  <g fill="#3a332b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="22" text-anchor="middle">
    <text x="225" y="78">idle</text>
    <text x="660" y="78">letter</text>
    <text x="1095" y="78">happy</text>
    <text x="225" y="768">sleepy</text>
    <text x="660" y="768">offline</text>
    <text x="1095" y="768">peek · behind the door</text>
  </g>
  <use href="#ghost-idle" x="75" y="100" width="300" height="500"/>
  <use href="#ghost-letter" x="510" y="100" width="300" height="500"/>
  <use href="#ghost-happy" x="945" y="100" width="300" height="500"/>
  <use href="#ghost-sleepy" x="135" y="785" width="160" height="250"/>
  <use href="#ghost-offline" x="570" y="785" width="160" height="250"/>
  <use href="#ghost-peek" x="1005" y="785" width="160" height="250"/>
</svg>
