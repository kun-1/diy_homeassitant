<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 660" role="img" aria-labelledby="title desc">
  <title id="title">Ink Shadow Ghost</title>
  <desc id="desc">A tall charcoal ghost with an ivory folded corner and a warm ochre window.</desc>

  <style>
    .body { fill: #625f58; stroke: #3a332b; stroke-width: 6; stroke-linecap: round; stroke-linejoin: round; }
    .shadow { fill: #4e4a44; }
    .fold { fill: #eee6d7; stroke: #3a332b; stroke-width: 5; stroke-linecap: round; stroke-linejoin: round; }
    .window { fill: #d4a84f; stroke: #3a332b; stroke-width: 5; stroke-linecap: round; stroke-linejoin: round; }
    .window-light { fill: #e8c873; }
    .line { fill: none; stroke: #3a332b; stroke-width: 4; stroke-linecap: round; stroke-linejoin: round; }
  </style>

  <g id="ghost">
    <path id="silhouette" class="body" d="M92 617
      C110 552 118 487 113 409
      C108 328 101 241 115 171
      C126 116 155 70 203 38
      L246 0 L258 78
      L315 94
      C338 181 336 275 334 361
      C332 452 349 537 384 592
      C359 610 326 617 292 611
      C258 632 225 633 193 614
      C159 628 124 628 92 617 Z"/>

    <path id="side-shadow" class="shadow" opacity=".44" stroke="none" d="M273 83
      C315 160 319 269 318 362
      C317 454 335 536 367 585
      C344 598 317 601 292 595
      C276 600 261 602 245 600
      C264 557 275 498 272 418
      C268 309 254 201 273 83 Z"/>

    <path id="folded-corner" class="fold" d="M246 0 L258 78 L298 70 Z"/>

    <path id="window" class="window" d="M253 178
      Q274 156 294 178
      L300 241
      Q278 254 254 252 Z"/>
    <path class="window-light" d="M259 180 Q274 167 287 181 L291 235 Q276 242 261 241 Z"/>
    <path id="window-mullions" class="line" d="M274 168 L278 247 M258 213 Q276 209 296 211"/>

    <g id="face" fill="#3a332b" stroke="none">
      <ellipse cx="132" cy="193" rx="4.5" ry="11"/>
      <ellipse cx="169" cy="193" rx="4.5" ry="11"/>
    </g>
  </g>
</svg>
